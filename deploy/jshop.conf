<VirtualHost *:80>
    ServerName jshop.basta.lan
    ServerAlias www.basta.lan servidor.basta.lan basta.lan
    DocumentRoot /var/www/jshop

    <Directory /var/www/jshop>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <DirectoryMatch "/var/www/jshop/(config|database)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog /var/log/httpd/jshop_error.log
    CustomLog /var/log/httpd/jshop_access.log combined
</VirtualHost>
