<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iStore Accesorios | Accesorios para iPhone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="index.html">iStore<span>Accesorios</span></a>
    <div class="barra-acciones">
      <a class="enlace-admin" href="admin.html">Administrar tienda</a>
      <button id="btnCarrito" class="btn-carrito" aria-label="Abrir pedido">
        Mi pedido <span id="contadorCarrito" class="contador">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="portada">
      <h1>Todo lo que tu iPhone necesita, en stock hoy</h1>
      <p>Elige tus accesorios, arma tu pedido y envíalo por WhatsApp.</p>
      <div class="buscador">
        <input id="buscador" type="search" placeholder="Busca audífonos, cargadores, fundas…" aria-label="Buscar productos">
      </div>
      <div id="categorias" class="chips" aria-label="Categorías"></div>
    </section>

    <section class="catalogo">
      <div id="productos" class="rejilla"></div>
    </section>
  </main>

  <!-- Panel del pedido -->
  <div id="velo" class="velo"></div>
  <aside id="panelCarrito" class="panel" aria-hidden="true">
    <div class="panel-cabecera">
      <h2>Mi pedido</h2>
      <button id="cerrarCarrito" class="btn-icono" aria-label="Cerrar">✕</button>
    </div>
    <div id="itemsCarrito" class="items"></div>
    <div class="panel-pie">
      <div class="total"><span>Total</span><strong id="totalCarrito">$0.00</strong></div>
      <label for="nombreCliente">Tu nombre</label>
      <input id="nombreCliente" type="text" placeholder="Ej. Ana López" autocomplete="name">
      <button id="btnEnviar" class="btn-wa">Pedir por WhatsApp</button>
    </div>
  </aside>

  <a id="btnWhatsapp" class="wa-flotante" target="_blank" rel="noopener">Contactar por WhatsApp</a>

  <script src="js/data.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
